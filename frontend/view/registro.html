<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TourInvest | Registro</title>
  <link rel="icon" type="image/png" href="../assets/imgs/tourinvest.png">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div><img class="logo-circle" src="../assets/imgs/tourinvest.png" alt="TourInvest"></div>
        <h1>Crear cuenta</h1>
        <p>Regístrate como inversionista</p>
      </div>

      <div id="mensaje-global" class="mensaje-global"></div>

      <!-- Registrar usuario (rol público → siempre Inversionista) -->
      <form id="registroForm" onsubmit="return registrarUsuario(event)">
        <div class="field">
          <label for="nombre1">Nombre</label>
          <input type="text" id="nombre1" name="nombre1" required>
          <div class="field__mensaje-error"></div>
        </div>
        <div class="field">
          <label for="apellido1">Apellido</label>
          <input type="text" id="apellido1" name="apellido1" required>
          <div class="field__mensaje-error"></div>
        </div>
        <div class="field">
          <label for="cedula">Cédula</label>
          <input type="text" id="cedula" name="cedula" required>
          <div class="field__mensaje-error"></div>
        </div>
        <div class="field">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
          <div class="field__mensaje-error"></div>
        </div>
        <div class="field">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required>
          <div class="field__mensaje-error"></div>
        </div>
        <div class="field">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" minlength="6" required>
          <div class="field__mensaje-error"></div>
        </div>
        <div class="field">
          <label for="confirmarContrasena">Confirmar contraseña</label>
          <input type="password" id="confirmarContrasena" name="confirmarContrasena" minlength="6" required>
          <div class="field__mensaje-error"></div>
        </div>
        <button type="submit" class="btn-primary">Registrarme</button>
      </form>

      <div class="auth-links">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </div>
    </div>
  </div>
  <script src="../js/auth.js" defer></script>
</body>
</html>
