# ===== TourInvest - PERFIL DE PRODUCCION =====
# Uso:
#   java -jar tourinvest-backend.jar --spring.profiles.active=prod
#
# En este perfil la aplicacion RECHAZA arrancar si falta la configuracion
# critica (password de BD o clave JWT), en lugar de fallar en silencio o
# arrancar con secretos de ejemplo. Ver JwtConfigValidator.

# No se crea/modifica el esquema en produccion: el esquema lo gobierna
# query.sql (fuente de verdad), aplicado por `setup seed`.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Arranque fail-fast (sobrescribe el perfil de desarrollo):
# la aplicacion DEBE morir si la BD no responde, en vez de esperar al usuario
# hasta la primera peticion. Ademas la BD queda validada al arrancar.
spring.main.lazy-initialization=false
spring.jpa.defer-datasource-initialization=false
spring.main.banner-mode=off

# Pool con capacidad real para varios usuarios concurrentes.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:20}
spring.datasource.hikari.connection-timeout=30000

# Oculta el rastro interno de excepciones en las respuestas al cliente.
# El GlobalExceptionHandler sigue devolviendo mensajes claros y utiles.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Trazas HTTP (access log) para auditoria en el servidor.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.pattern=%t %a "%r" %s %b %D

# Nadie debe escuchar en todas las interfaces con la config por defecto.
server.address=${SERVER_ADDRESS:127.0.0.1}

logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.tourinvest=${LOG_LEVEL:INFO}
logging.file.name=logs/tourinvest-backend.log
