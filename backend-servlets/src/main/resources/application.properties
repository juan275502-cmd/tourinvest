# ===== TourInvest - Backend Spring Boot (Java) =====
# CONFIGURACION base (perfil por defecto = desarrollo local).
#
# En PRODUCCION no uses este archivo: activa el perfil `prod`
#   java -jar tourinvest-backend.jar --spring.profiles.active=prod
# que toma TODOS los valores sensibles de variables de entorno.
#
# ---------- CONVENCION DE HOSTNAME (no improvisar: usa 127.0.0.1) ----------
# Este proyecto usa EXCLUSIVAMENTE la direccion de loopback IPv4 `127.0.0.1`.
# NO se usa `localhost` a proposito: en IPv6 `localhost` resuelve a `::1` y eso
# rompe de forma intermitente tanto JDBC como CORS (el navegador abre un origen
# y Spring responde en otro, o el socket MySQL se busca en /var/run/mysqld).
# `127.0.0.1` es inequivoco: siempre IPv4, siempre TCP, siempre el mismo origen.
#
# El nombre visible para las personas es `www.tourinvest.com`, que se mapea a
# 127.0.0.1 en el archivo de hosts del sistema (ver STARTUP.md, seccion
# "Convencion de hostname"). Asi la app se usa como www.tourinvest.com (sitio,
# puerto 80: sin ":80" en la URL) y www.tourinvest.com:8080 (API), sin depender
# de Internet.
#
# Todos los valores admiten sobreescritura por variable de entorno,
# de modo que ningun secreto queda escrito en el repositorio:
#   DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, JWT_EXPIRATION_MS, SERVER_PORT,
#   CORS_ALLOWED_ORIGINS, JPA_DDL_AUTO, JPA_SHOW_SQL, LOG_LEVEL

spring.application.name=tourinvest-backend

# ===== Puerto =====
# Puerto del backend Spring Boot (consumido por los JS de frontend/js/*.js)
server.port=${SERVER_PORT:8080}

# ===== Datasource (MySQL/MariaDB) =====
# allowPublicKeyRetrieval=true es OBLIGATORIO con MySQL 8/9 cuando useSSL=false
# (sin ello: «Public Key Retrieval is not allowed»).
# Ver query.sql para el esquema de la base de datos tourinvest.
#
# IMPORTANTE: la URL se COMPONE con DB_HOST/DB_PORT/DB_NAME. Antes era un valor
# unico con 127.0.0.1:3306 fijos, lo que hacia que ignorar esas variables y
# conectara siempre al puerto por defecto aunque .env dijera otro.
# Para una URL totalmente distinta (p. ej. servidor remoto) define DB_URL.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:tourinvest}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
# Sin clave por defecto en el repositorio. Definela en un archivo .env
# (ver .env.example) o exporta DB_PASSWORD antes de arrancar.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
# Nota: Hibernate detecta solo el dialecto de MySQL moderno; NO declararlo evita
# las advertencias HHH90000025/HHH90000026.

# ===== JWT (JwtUtil) =====
# Clave HMAC-SHA256 de al menos 256 bits (>= 32 caracteres).
# El valor por defecto SOLO sirve para desarrollo local.
jwt.secret=${JWT_SECRET:clave-de-desarrollo-tourinvest-cambiar-en-produccion-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===== CORS =====
# Origenes permitidos, separados por coma. El canonico es el sitio servido en
# el puerto 80: como es el puerto por defecto de HTTP, el origen NO lleva
# puerto y se escribe solo `http://www.tourinvest.com` (sin ":80").
# En produccion se restringe via CORS_ALLOWED_ORIGINS al dominio real.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://www.tourinvest.com,http://www.tourinvest.com:5500}

# ===== Logging =====
logging.level.root=${LOG_LEVEL:INFO}

# ===== Arranque rapido (solo desarrollo) =====
# Medido en este proyecto: el arranque se reparte en ~14s de Maven (arrancar la
# JVM de Maven, resolver el POM y compilar) + ~20s de Spring (escaneo de repos,
# pool de conexiones, EntityManagerFactory y cadena de seguridad).
#
# Estas opciones recortan la parte de Spring SIN cambiar el comportamiento:
#   * banner-mode=off       -> quita el banner ASCII (ahorra ~0,6s)
#   * lazy-initialization   -> crea los beans cuando se usan, no al arrancar
#   * defer-datasource-init -> no abre el pool hasta la primera peticion
# Son seguras en desarrollo. El perfil `prod` las desactiva (arranque fail-fast:
# la aplicacion debe morir si la BD no responde, no esperar a la primera peticion).
spring.main.banner-mode=${BANNER_MODE:off}
spring.main.lazy-initialization=${LAZY_INIT:true}
spring.jpa.defer-datasource-initialization=${DEFER_DS:true}

# Pool Dimensionado para desarrollo: 1-2 usuarios simultaneos.
# Reducirlo evita esperar a abrir conexiones que no se van a usar.
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:5}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:10000}



