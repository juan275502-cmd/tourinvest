# ===== TourInvest - Backend Spring Boot (Java) =====
# Driver MySQL. Ver query.sql para el esquema de la base de datos tourinvest.
# allowPublicKeyRetrieval=true es OBLIGATORIO con MySQL 8/9 cuando useSSL=false
# (sin ello: «Public Key Retrieval is not allowed»).
spring.datasource.url=jdbc:mysql://localhost:3306/tourinvest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# PON AQUI la contrasena real del usuario root de tu MySQL (dejala vacia tras '=' si no tiene):
# Configuración segura (GA7-220501096-AA3-EV01): la contraseña se lee de la
# variable de entorno DB_PASSWORD. El valor tras ':' es SOLO el fallback local
# de este equipo; en producción/despliegue debe definirse DB_PASSWORD y nunca
# versionarse el valor real.
spring.datasource.password=${DB_PASSWORD:Ju4nd1eg0fuentes*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Nota: Hibernate detecta solo el dialecto de MySQL moderno; NO declararlo evita
# las advertencias HHH90000025/HHH90000026.

# ===== JWT (JwtUtil) =====
# Clave HMAC-SHA256 de al menos 256 bits (>= 32 caracteres). CAMBIAR en producción.
jwt.secret=cambiar-esta-clave-secreta-por-una-aleatoria-de-32+
jwt.expiration-ms=3600000

# Puerto del backend Spring Boot (consumido por los JS de frontend/js/*.js)
server.port=8080

